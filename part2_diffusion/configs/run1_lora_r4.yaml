# Run 1: LoRA, rank 4, on the UNet attention projections.
name: run1_lora_r4
method: lora
rank: 4
lora_alpha: 4
target_modules: [to_k, to_q, to_v, to_out.0]
learning_rate: 1.0e-4
lr_scheduler: constant
warmup_steps: 0
max_train_steps: 1500      # same step budget for both runs
train_batch_size: 4
gradient_checkpointing: true
mixed_precision: fp16      # T4 has no bf16
max_grad_norm: 1.0
random_flip: true
checkpoint_every: 500
