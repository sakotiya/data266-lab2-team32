# Shared Part 2 settings. Run-specific settings are in run1_*.yaml / run2_*.yaml.
seed: 266
base_model: stable-diffusion-v1-5/stable-diffusion-v1-5
dataset: lambdalabs/naruto-blip-captions
resolution: 512
test_fraction: 0.10
near_dup_hamming: 4        # dHash bits that may differ for two images to count as near-duplicates
min_side: 64               # smaller images count as corrupted
min_pixel_std: 2.0         # a (near) single-colour image counts as corrupted

# Same sampler settings for the base model and both runs (task 2.3).
generation:
  scheduler: dpmsolver++
  steps: 30
  guidance_scale: 7.5
  seeds: [0, 1]
  height: 512
  width: 512

eval:
  clip_model: openai/clip-vit-large-patch14
  kid_subset_size: 10
  kid_subsets: 100
  lpips_net: alex
  human_pairs: 25
  memorization_images: 10
  grid_prompts: [ID01, ID02, ID03, ID04, OD01, OD02, CP01, CP02]

hub:
  model_repo_prefix: data266-team32-naruto-sd15
  image_dataset: data266-team32-p2-images

# P2_SMOKE=1: a quick end-to-end check of the code before the long run.
smoke:
  max_train_steps: 10
  checkpoint_every: 0
  prompts_per_category: 1
  kid_subset_size: 2
  kid_subsets: 5
  human_pairs: 4
  memorization_images: 2
